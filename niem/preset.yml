schema_version: "1.0"

preset:
  id: "niem"
  name: "NIEM Information Exchanges"
  version: "1.0.1"
  description: "Adds evidence-based NIEM exchange modeling to the core, assess, and bugfix processes while preserving their commands, artifacts, and scope."
  author: "mnriem"
  repository: "https://github.com/mnriem/spec-kit-presets"
  license: "MIT"

requires:
  speckit_version: ">=1.0.4"
  extensions:
    - assess
    - bug

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Business-level exchange requirements and interoperability acceptance"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Versioned NIEM mappings, message contracts, and evidence planning"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Requirement-to-mapping-to-task coverage for approved exchange work"
      strategy: "append"
    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "NIEM requirements-quality review topics, not implementation checks"
      strategy: "append"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Semantic ownership, verified reuse, compatibility, and conformance evidence"
      strategy: "append"
    - type: "template"
      name: "niem-guidance"
      file: "templates/niem-guidance.md"
      description: "Shared NIEM sources, evidence rules, modeling principles, and scope boundaries"
    - type: "template"
      name: "niem-mapping-template"
      file: "templates/niem-mapping-template.md"
      description: "Component mapping records for the existing data-model artifact"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Apply NIEM governance through the existing constitution amendment process"
      strategy: "wrap"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Specify information exchange needs without premature schema design"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Clarify exchange semantics and acceptance within the existing question budget"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan verified reuse, local extensions, formats, and conformance evidence"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Decompose approved exchange work into traceable story-based tasks"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Review NIEM cross-artifact consistency without changing files"
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Review NIEM requirements quality without certifying implementation"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement approved mappings and record actual validation evidence"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Append only NIEM delivery gaps traceable to existing approved intent"
      strategy: "wrap"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/speckit.taskstoissues.md"
      description: "Preserve mapping references, evidence needs, and task identity in issue handoff"
      strategy: "wrap"

    - type: "command"
      name: "speckit.assess.intake"
      file: "commands/speckit.assess.intake.md"
      description: "Capture an exchange idea without presupposing NIEM adoption"
      strategy: "wrap"
    - type: "command"
      name: "speckit.assess.research"
      file: "commands/speckit.assess.research.md"
      description: "Research NIEM fit, authoritative evidence, and counter-evidence"
      strategy: "wrap"
    - type: "command"
      name: "speckit.assess.define"
      file: "commands/speckit.assess.define.md"
      description: "Define the interoperability problem independently of the solution"
      strategy: "wrap"
    - type: "command"
      name: "speckit.assess.shape"
      file: "commands/speckit.assess.shape.md"
      description: "Compare bounded NIEM and non-NIEM concepts without detailed design"
      strategy: "wrap"
    - type: "command"
      name: "speckit.assess.decide"
      file: "commands/speckit.assess.decide.md"
      description: "Make an evidence-qualified decision without treating adoption as success"
      strategy: "wrap"

    - type: "command"
      name: "speckit.bug.assess"
      file: "commands/speckit.bug.assess.md"
      description: "Assess exchange defects without changing source or upgrading NIEM"
      strategy: "wrap"
    - type: "command"
      name: "speckit.bug.fix"
      file: "commands/speckit.bug.fix.md"
      description: "Apply a surgical exchange fix preserving established compatibility"
      strategy: "wrap"
    - type: "command"
      name: "speckit.bug.test"
      file: "commands/speckit.bug.test.md"
      description: "Verify the reproduction and report actual exchange validation coverage"
      strategy: "wrap"

tags:
  - "niem"
  - "interoperability"
  - "data-modeling"
  - "information-exchange"
  - "assess"
  - "bugfix"
